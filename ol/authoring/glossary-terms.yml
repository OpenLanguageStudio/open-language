# The technical terms every Coursebook shares. A language repository adds its
# own in a glossary-terms.yml next to its open-language.yml.
#
# A term on either list has exactly one entry on the Terminology page, and the
# first use of it in an article's prose is written with the {term} role, or its
# sentence links to the article that covers it.
#
# The list holds grammar words a general reader would not know. Everyday words
# such as noun, verb, plural, past tense and question word are not on it: an
# article may still link them with {term} where the glossary has an entry.
#
# An item is the term alone, which also matches the term with an -s, or a
# mapping that names the other forms an article writes it in:
#
#   terms:
#     - noun
#     - term: prefix
#       forms: [prefixes]

terms:
  # Parts of speech
  - pronoun
  - personal pronoun
  - adverb
  - preposition
  - conjunction

  # Verbs
  - infinitive
  - term: conjugation
    forms: [conjugate, conjugates, conjugated, conjugating]
  - imperative

  # Comparing
  - comparative
  - superlative

  # Sentences
  - subject
  - object
  - direct object
  - indirect object
  - clause
  - main clause
  - subordinate clause
  - relative clause
  - term: negation
    forms: [negate, negates, negated, negating]
