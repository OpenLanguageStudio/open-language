# The technical terms every Coursebook shares. A language repository adds its
# own in a glossary-terms.yml next to its open-language.yml.
#
# A term on either list has exactly one entry on the Terminology page, and the
# first use of it in an article's prose is written with the {term} role.
#
# An item is the term alone, which also matches the term with an -s, or a
# mapping that names the other forms an article writes it in:
#
#   terms:
#     - noun
#     - term: prefix
#       forms: [prefixes]

terms:
  # Parts of speech
  - noun
  - pronoun
  - personal pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - conjunction
  - question word

  # Number
  - singular
  - plural

  # Verbs
  - infinitive
  - term: conjugation
    forms: [conjugate, conjugates, conjugated, conjugating]
  - tense
  - present tense
  - past tense
  - future tense
  - imperative

  # Comparing
  - comparative
  - superlative

  # Sentences
  - subject
  - object
  - direct object
  - indirect object
  - clause
  - main clause
  - subordinate clause
  - relative clause
  - word order
  - term: negation
    forms: [negate, negates, negated, negating]
