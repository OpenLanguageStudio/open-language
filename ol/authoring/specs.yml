# Validation spec for Open Language article types.
# Consumed by ol/authoring/validate.py (`ol validate`).
#
# docs/reference/page-standard.md names each rule these limits belong to. A
# change to a rule changes that page and this file in the same pull request.
#
# Common checks (all articles, hardcoded in the script):
#   - frontmatter with html_meta description/keywords
#   - exactly one H1; NO CEFR level prefix in index titles
#   - NO {practice} blocks (learners stay on our platforms)
#   - NO HTML comments (agent notes leak into built HTML)
#   - NO blockquote subtitle under the H1
#   - NO :::{seealso} blocks (use Prerequisites admonition or Related articles)
#   - doc links resolve; no unfilled {{PLACEHOLDER}}
#   - NO TODO or FIXME notes (they leak into built HTML)
#   - NO CEFR level and NO category prefix in article titles
#   - NO hand-numbered headings, NO external-reading or "See also" section
#     in an article, NO Related articles link to another article of the same
#     subcategory, or, in a flat category directory, to a toctree neighbour
#   - Prerequisites lists at most `max_prerequisites` links
#   - "Hear it in practice" is never collapsed in a dropdown
#   - example block size, marking limits, audio example counts, model-text
#     length and stock vocabulary, with the limits under `common` below
#
# The site menu (the toctrees of the top-level index.md and each level index)
# is checked by ol/authoring/menu.py, not per article type.
#
# Per-type keys:
#   sections: the article's H2s in order. An item names a `heading`, or a `match`
#     regex with a `label`, or stands for the sections with names of their own
#     (`other: true`). `count: [low, high]` is how many it may have; default one.
#   require_examples_div: at least one ":::{div} ol-examples" block
#   require_summary_admonitions / require_common_mistakes
#   min_audio_examples: minimum count of :::{audio-examples} blocks
#   ordered: toctree order in the category index is the learning sequence
#   min_pack_words / max_pack_words: rows in the table under "The words"
#   numbered_filename: the file name ends in a running number (at-the-beach-1)

common:
  # A body shorter than this is a stub, reported but not held to the templates.
  stub_body_bytes: 200
  description_max_chars: 160
  # The opening: the lead paragraph, then the explanation paragraph.
  lead_min_words: 20
  lead_max_words: 50
  lead_max_sentences: 2
  explanation_min_words: 40
  explanation_max_words: 120
  opening_max_words: 180
  # Headings.
  h1_max_words: 5
  max_h2: 7
  max_h3: 6
  heading_max_words: 8
  # Tables. Tables of forms are the wider kind, and exist only in grammar.
  table_max_columns: 3
  forms_table_max_columns: 5
  # A table header holding one of these whole words, in any position, is a
  # translation column, which no table has. A language adds the words its own
  # headers use under `translation_headers` in open-language.yml.
  translation_headers:
    - English
    - Translation
    - Meaning
  # Plain language. Over the average is a warning, the rest are errors.
  sentence_max_words: 25
  paragraph_max_sentences: 5
  sentence_average_words: 18
  # A full stop after one of these does not end a sentence.
  sentence_abbreviations:
    - "e.g."
    - "i.e."
    - "etc."
    - "vs."
    - "cf."
    - "z. B."
    - "z.B."
    - "d. h."
    - "d.h."
    - "usw."
    - "Mr."
    - "Mrs."
    - "Ms."
    - "Dr."
    - "Hr."
    - "Fr."
    - "St."
    - "No."
  glossary_entry_max_words: 30
  index_max_sentences: 3
  check_doc_links: true
  # Prerequisites name true dependencies only.
  max_prerequisites: 3
  # Inline example blocks. The target is 3 examples; 4 is the hard limit.
  max_examples_per_block: 4
  # Marking scheme: distinct roles a reader holds at once.
  max_roles_per_sentence: 2
  max_roles_per_block: 4
  # Example pairs per audio track (about 20 fills a 70 second track).
  min_audio_examples: 12
  max_audio_examples: 30
  # Writing model texts: below this the track is too short for the stores.
  min_model_text_words: 60
  # Stock machine-writing vocabulary, as regex fragments matched on whole
  # words in prose. Only words with no honest use in a grammar explanation
  # belong here; anything that can gloss the target language does not.
  ai_vocabulary:
    - "additionally"
    - "moreover"
    - "furthermore"
    - "crucial"
    - "pivotal"
    - "delv(?:e|es|ed|ing)"
    - "tapestry"
    - "testament"
    - "interplay"
    - "intricate"
    - "intricacies"
    - "vibrant"
    - "seamless(?:ly)?"
    - "robust"
    - "realm"
    - "showcas(?:e|es|ed|ing)"
    - "underscor(?:e|es|ed|ing)"
    - "foster(?:s|ed|ing)?"
    - "garner(?:s|ed|ing)?"
    - "leverag(?:e|es|ed|ing)"
    - "embark(?:s|ed|ing)?"
    - "unlock(?:s|ed|ing)?"
    - "elevat(?:e|es|ed|ing)"
    - "deep dive"
    - "dive into"
    - "game.changer"
    - "plays? a (?:key|vital|crucial|significant|pivotal) role"
    - "serves? as a"
    - "stands? as a"
    - "it(?: is|'s) (?:important|worth) (?:to note|noting)"
    - "due to the fact that"
    - "at this point in time"
    - "when it comes to"
    - "at the end of the day"
    - "a wide range of"
    - "in conclusion"
    - "rest assured"

# The render check in `ol check`: no page scrolls sideways at this width.
render:
  viewport_width: 360
  viewport_height: 800

# The level overview page.
level_page:
  lead_max_words: 40
  know_bullets: [3, 5]
  can_do_bullets: [4, 6]
  bullet_max_words: 15
  overview_max_words: 150

# The Introduction page.
introduction_page:
  lead_max_words: 60
  how_max_words: 80
  level_bullet_max_words: 20
  category_bullet_max_words: 25
  start_bullets: [2, 4]
  page_max_words: 350

types:
  grammar:
    # Form, use and contrast sections have names of their own. One of each
    # kind at least, five in all.
    sections:
      - other: true
        count: [2, 5]
      - heading: Hear it in practice
      - heading: Summary
      - heading: Related articles
        count: [0, 1]
    no_h3_sections: [Summary, Related articles]
    max_examples_per_section: 3
    require_examples_div: true
    require_summary_admonitions: true
    require_common_mistakes: true
    min_audio_examples: 1
    ordered: false

  how-to:
    # The H1 finishes "How to ...": a verb in its base form opens it.
    sections:
      - heading: When to use it
      - heading: Key phrases
      - other: true
        count: [0, 3]
      - heading: Culture note
        count: [0, 1]
      - heading: Hear it in practice
      - heading: Summary
      - heading: Related articles
        count: [0, 1]
    culture_note_max_words: 80
    require_examples_div: true
    require_summary_admonitions: true
    require_common_mistakes: false
    min_audio_examples: 1
    ordered: false
    english_filename: true

  writing:
    # Each example holds the model text, a note on it and its own
    # "### Hear it in practice".
    sections:
      - match: "^Example: [A-Z]"
        label: "Example: <Situation>"
        count: [1, 2]
      - heading: Building blocks
      - heading: Summary
      - heading: Related articles
        count: [0, 1]
    example_note_max_words: 60
    require_examples_div: false
    require_summary_admonitions: true
    require_common_mistakes: true
    min_audio_examples: 1
    ordered: false
    english_filename: true
    # One scenario per article, numbered per register family (email-formal-1).
    numbered_filename: true

  # Vocabulary packs.
  vocabulary:
    sections:
      - heading: The words
      - other: true
        count: [0, 2]
      - heading: Hear it in practice
      - heading: Summary
      - heading: Related articles
        count: [0, 1]
    require_examples_div: false
    require_summary_admonitions: false
    require_common_mistakes: false
    min_audio_examples: 1
    ordered: false
    english_filename: true
    # 10 to 15 new words on one theme; a word-class pack runs to 20.
    min_pack_words: 10
    max_pack_words: 20
    # Packs on a theme continue from one another (at-the-beach-1, -2).
    numbered_filename: true
