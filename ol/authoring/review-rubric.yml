# Review rubric for a coursebook article.
#
# `ol validate` checks what a script can measure. This rubric covers what
# needs a reader: whether the article teaches the right thing, at the right
# level, in plain English and correct target language.
#
# A review answers every item with one of `answers`, and gives a line number
# and one sentence for anything that is not a pass. Nothing else is free text.
# An article passes review when no item is answered `fail`.

answers: [pass, concern, fail]

items:
  - id: level-vocabulary
    area: level
    question: >-
      Do the example sentences use only vocabulary a learner at this CEFR level
      can be expected to know, apart from the words the article is teaching?
    fail_when: Several examples depend on words from a higher level.

  - id: level-grammar
    area: level
    question: >-
      Do the examples avoid grammar the learner has not met yet at this level,
      other than the structure being taught?
    fail_when: >-
      An example relies on a structure taught at a later level, such as a
      subordinate clause or a past tense in an A1 article that is not about it.

  - id: level-explanation
    area: level
    question: >-
      Is the explanation pitched at this level: short sentences, one idea at a
      time, grammatical terms introduced before they are used?
    fail_when: The explanation assumes terminology or background a learner here lacks.

  - id: language-correct
    area: correctness
    question: >-
      Is every target-language sentence grammatical, natural, and something a
      native speaker would say?
    fail_when: Any example is ungrammatical or would sound wrong to a native speaker.

  - id: translation-accurate
    area: correctness
    question: Does every translation say what its sentence says, in natural English?
    fail_when: A translation changes the meaning or mistranslates the taught structure.

  - id: rule-accurate
    area: correctness
    question: >-
      Are the stated rules true, and are exceptions that a learner at this
      level will meet mentioned?
    fail_when: A rule as stated is wrong or would lead to a predictable error.

  - id: examples-teach
    area: teaching
    question: >-
      Does each example show the structure the section is about, and do the
      examples vary enough to show the pattern and not one memorised sentence?
    fail_when: Examples do not contain the taught structure, or all share one frame.

  - id: single-topic
    area: teaching
    question: Does the article teach one thing, the thing its title names?
    fail_when: The article drifts into a second topic that has or needs its own article.

  - id: mistakes-real
    area: teaching
    question: >-
      Are the common mistakes ones learners at this level really make, each
      with its correction?
    fail_when: The listed mistakes are invented, or a correction is itself wrong.

  - id: category-fit
    area: teaching
    question: >-
      Does the article do what its category is for? Grammar teaches a
      structure, and pure vocabulary such as numbers or clock times is not
      grammar. A vocabulary pack teaches words on one theme, with no grammar
      and no functional phrases, and every word belongs at the pack's level. A
      writing article teaches correspondence (an email, a letter, a postcard
      or a message) in a stated register, never a form to fill in.
    fail_when: The article teaches what belongs to another category.

  - id: prerequisites-true
    area: teaching
    question: >-
      Does the Prerequisites admonition list only articles this one cannot be
      read without?
    fail_when: A listed article is related but not needed to follow this one.

  - id: related-reach
    area: teaching
    question: >-
      Do the Related articles links lead somewhere a reader would not reach
      by reading on, such as supporting grammar, a concept from another part
      of the level, or a vocabulary pack?
    fail_when: The links only repeat what the contents already lead to.

  - id: track-placement
    area: teaching
    question: >-
      Does the article have one "Hear it in practice" section at the end,
      unless it teaches parallel forms that are worth hearing one at a time?
      Where telling those forms apart is itself the skill, is there also a
      mixed section that puts them together?
    fail_when: >-
      Sections are split without parallel forms to separate, or parallel forms
      are only ever heard mixed together.

  - id: plain-english
    area: clear-language
    question: >-
      Is the prose plain and direct, with no filler, no inflated claims about
      importance, and no promotional tone?
    fail_when: >-
      Paragraphs could be cut without losing information, or the text sells
      the topic and does not explain it.

  - id: machine-tells
    area: clear-language
    question: >-
      Is the prose free of the patterns that mark machine writing: groups of
      three for rhythm, "not only X but Y" contrasts used for effect, sentence
      openers such as "Additionally" or "Moreover", synonym cycling for one
      thing, vague upbeat conclusions, and hedging stacked on hedging?
    fail_when: Two or more of these patterns appear in the article.
    note: >-
      "not only" and "in order to" are fine where they translate or explain a
      target-language structure.

  - id: reader-address
    area: clear-language
    question: >-
      Does the body text describe the language and its use, without talking to
      the reader about the course?
    fail_when: Body prose tells the reader what they will learn or already know.
    note: >-
      Direct "you" belongs in admonitions and in translations, where it is the
      English of the target language's own "you". A generic "you" deeper in
      the body that describes what speakers do is fine. Recast a sentence
      around the language as its subject rather than into the passive.

  - id: lead-content
    area: clear-language
    question: >-
      Does the lead paragraph open on the content itself (the situation, the
      pattern or the key word) in two to four sentences, and open differently
      from the articles next to it?
    fail_when: >-
      The lead is boilerplate that would fit any article, or opens the same way
      as its neighbours.

  - id: no-hedging
    area: clear-language
    question: >-
      Is the prose free of hedging that calls something simple or easy
      ("simply", "just", "easy") and of cheerleading ("amazing", "powerful")?
    fail_when: The prose reassures or enthuses where it should explain.
    note: >-
      "just" and "easy" are fine where they translate a target-language word.

  - id: language-placement
    area: clear-language
    question: >-
      Are the headings and the explanation in English, with target-language
      words in the prose marked with the course's roles, or in italics where
      no role fits, and used only to name a word or phrase?
    fail_when: >-
      A heading or a sentence of explanation is in the target language, or a
      target-language word in the prose is left unmarked.

  - id: layout-restraint
    area: clear-language
    question: >-
      Are tables narrow and split by section, with English headers and no
      full conjugation tables at A levels? Are tip and warning admonitions
      kept for real traps, with anything that matters in the body text and
      not in a note? Is the Summary a table when the content is tabular, and
      prose otherwise?
    fail_when: >-
      A reader has to work through a wide table, a run of notes, or a summary
      in a shape that does not fit its content.

  - id: cast-consistent
    area: consistency
    question: >-
      Where examples name people from the cast, do the facts match the cast
      entries in the workspace settings?
    fail_when: An example contradicts a cast member's stated job, family or home.
